<!-- The video library (migration 0068, owner 2026-10-28: "Think Splice, but for performance videos").
     PRIVATE since 0069 (owner 2026-10-28: "this should not be a public page ... only visible to ilan
     tzvi and myself", and Lilker): it runs inside the app's Videos tab and uses the app's own sign-in
     (same site, so the same saved session). The database decides who sees anything (can_view_library)
     and files open through short-lived signed links -- this page holds no secret and opens nothing by
     itself. Pick a singer, filter by Event, Tempo and Crowd, watch, download the original file. -->
<style>
  :root{
    --page:#0E0E11; --surface:#17171B; --surface-2:#1F1F24; --ink:#F2F1EC; --ink-2:#B4B3AD; --ink-3:#7E7D78;
    --border:#2A2A30; --border-strong:#3A3A42; --accent:#C9A86A; --accent-ink:#0E0E11; --chip:#24242A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--page); color:var(--ink); }
  html,body{ overflow-x:clip; overscroll-behavior-x:none; } html{ touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; }
  @media (max-width:860px){ input,select{ font-size:16px !important; } }
  body{ font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  body{ background:radial-gradient(1200px 520px at 50% -180px, rgba(201,168,106,.10), transparent 70%) no-repeat, var(--page); min-height:100vh; }
  .wrap{ max-width:1180px; margin:0 auto; padding:20px 16px calc(48px + env(safe-area-inset-bottom)); }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:34px; flex-wrap:wrap; }
  body.embed .top .logo{ display:none; }
  body.embed .top{ margin-bottom:18px; justify-content:flex-end; }
  .logo{ display:block; width:170px; max-width:60vw; height:auto; }
  .label{ font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:700; }
  .btn{ display:inline-flex; align-items:center; gap:6px; justify-content:center; padding:9px 14px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; text-decoration:none; transition:background .15s,border-color .15s; white-space:nowrap; }
  .btn:hover{ background:var(--surface-2); }
  .btn-gold{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-gold:hover{ background:#D8BA80; }
  h1{ font-size:clamp(1.6rem,3.4vw,2.3rem); margin:0; letter-spacing:-.02em; font-weight:700; line-height:1.15; }
  .intro{ margin-bottom:26px; }
  .intro p{ margin:8px 0 0; color:var(--ink-2); font-size:15px; max-width:520px; }
  .label{ color:var(--accent); }
  .muted{ color:var(--ink-2); font-size:13.5px; }
  /* home */
  .singers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr)); gap:18px; }
  .singer{ position:relative; display:block; text-decoration:none; border-radius:18px; overflow:hidden; aspect-ratio:4/5; background:var(--surface); box-shadow:0 0 0 1px var(--border) inset; transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s; }
  .singer:hover{ transform:translateY(-4px); box-shadow:0 0 0 1px rgba(201,168,106,.55) inset, 0 18px 40px rgba(0,0,0,.45); }
  .singer .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 20%, #2B2A2F, #141417 70%); font-size:3.4rem; font-weight:300; letter-spacing:.06em; color:rgba(201,168,106,.75); }
  .singer .ph img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s cubic-bezier(.2,.7,.3,1); }
  .singer:hover .ph img{ transform:scale(1.04); }
  .singer .nm{ position:absolute; left:0; right:0; bottom:0; padding:44px 16px 15px; display:flex; flex-direction:column; gap:2px; min-width:0; background:linear-gradient(transparent, rgba(8,8,10,.92)); }
  .singer .nm strong{ font-size:1.08rem; font-weight:650; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .singer .nm .muted{ font-size:12.5px; }
  /* singer page */
  .hero{ display:flex; align-items:center; gap:16px; margin-bottom:18px; min-width:0; }
  .hero{ margin-bottom:24px; }
  .hero .av{ width:76px; height:76px; border-radius:50%; overflow:hidden; background:radial-gradient(circle at 30% 20%, #2B2A2F, #141417 70%); box-shadow:0 0 0 1px rgba(201,168,106,.45); flex:none; display:flex; align-items:center; justify-content:center; font-weight:300; letter-spacing:.05em; font-size:1.6rem; color:rgba(201,168,106,.85); }
  .hero .av img{ width:100%; height:100%; object-fit:cover; }
  .filters{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px 14px; margin-bottom:16px; display:flex; flex-direction:column; gap:10px; }
  .frow{ display:flex; align-items:flex-start; gap:10px; min-width:0; }
  .frow .label{ width:64px; flex:none; padding-top:7px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; min-width:0; }
  .chip{ padding:6px 12px; border-radius:999px; border:1px solid var(--border-strong); background:var(--chip); color:var(--ink-2); font:inherit; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s,color .15s,border-color .15s; }
  .chip:hover{ color:var(--ink); border-color:#4A4A54; }
  .chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:4px 0 12px; flex-wrap:wrap; }
  .search{ flex:1 1 220px; max-width:360px; padding:9px 14px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font:inherit; font-size:14px; }
  .search::placeholder{ color:var(--ink-3); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:16px; }
  .vid{ background:var(--surface); border:1px solid var(--border); border-radius:16px; transition:border-color .2s,transform .2s; overflow:hidden; display:flex; flex-direction:column; min-width:0; }
  .vid:hover{ border-color:var(--border-strong); }
  .thumb{ position:relative; aspect-ratio:16/9; background:#000; cursor:pointer; overflow:hidden; border:0; padding:0; width:100%; display:block; }
  .thumb img,.thumb video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .dur{ position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.72); color:#fff; font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:6px; }
  .thumb .play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:52px; height:52px; border-radius:50%; background:rgba(14,14,17,.62); display:flex; align-items:center; justify-content:center; transition:opacity .15s; }
  .thumb:hover .play{ opacity:0; }
  .vb{ padding:11px 13px 13px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .vt{ font-weight:650; font-size:14.5px; overflow-wrap:anywhere; }
  .vs{ font-size:12.5px; color:var(--ink-3); overflow-wrap:anywhere; margin-top:-5px; }
  .badges{ display:flex; flex-wrap:wrap; gap:5px; }
  .badge{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--ink-2); border:1px solid var(--border); }
  .vf{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:auto; }
  .empty{ text-align:center; padding:64px 16px; color:var(--ink-2); background:linear-gradient(var(--surface),rgba(23,23,27,.4)); border:1px solid var(--border); border-radius:18px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .empty svg{ color:var(--accent); opacity:.8; }
  .empty strong{ color:var(--ink); font-size:16px; }
  /* player */
  .ov{ position:fixed; inset:0; background:rgba(0,0,0,.86); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .player{ width:min(1000px,100%); display:flex; flex-direction:column; gap:10px; }
  .player video{ width:100%; max-height:76vh; background:#000; border-radius:12px; display:block; }
  .ph-bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  @media (max-width:560px){ .frow{ flex-direction:column; gap:4px; } .frow .label{ padding-top:0; width:auto; } h1{ font-size:1.3rem; } .hero .av{ width:56px; height:56px; } }
</style>
