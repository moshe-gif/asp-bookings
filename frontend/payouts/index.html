<!-- The artist's payout setup page (migration 0063, Edge Function payee-onboard). Standalone like
     /pay/: no app code, no sign-in. The artist enters their bank and tax details on Stripe's own pages
     (this page only sends them there and back). The token is after the "#", so it only ever travels
     in POST bodies to payee-onboard. -->
<style>
  :root{
    --page:#F5F4EF; --surface:#FFFFFF; --ink:#17171A; --ink-2:#67676D; --ink-3:#9A9AA1;
    --border:#E1E1E6; --accent:#4C6FA5; --accent-hover:#3D5C8C; --good:#2F7D5B; --good-wash:#E3F1EA;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font:15px/1.55 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:560px; margin:0 auto; padding:24px 16px calc(32px + env(safe-area-inset-bottom)); }
  .logo{ display:block; width:200px; max-width:100%; height:auto; margin-bottom:18px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px 20px; box-shadow:0 1px 2px rgba(23,23,26,.04),0 4px 14px rgba(23,23,26,.04); }
  h1{ font-size:1.25rem; margin:0 0 8px; }
  p{ margin:0 0 12px; color:var(--ink-2); font-size:14px; }
  ul{ margin:0 0 16px; padding-left:20px; color:var(--ink-2); font-size:14px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; width:100%; padding:12px 18px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; transition:background .15s; }
  .btn:hover{ background:var(--accent-hover); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .done{ background:var(--good-wash); border-radius:8px; padding:12px 14px; color:var(--ink); font-size:14px; margin:0 0 14px; }
  .done strong{ color:var(--good); }
  .test{ background:#FFF6DB; color:#7A5B00; border-radius:8px; padding:8px 12px; font-size:12.5px; margin:0 0 14px; }
  .err{ color:#A4473B; font-size:13.5px; margin:10px 0 0; min-height:1em; }
  .foot{ font-size:12px; color:var(--ink-3); margin:14px 0 0; }
</style>
<div class="wrap">
  <img class="logo" src="../assets/brand/asp-horizontal-dark.png" alt="ASP Management" width="120" height="16"/>
  <div class="card" id="root"><p>Loading…</p></div>
</div>
