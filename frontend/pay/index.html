<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Pay Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" type="image/png" href="../icon-192.png" />
<!-- The client's payment page for an invoice (migration 0056) or a gig's balance (0063), Edge Function
     client-pay. Standalone like /sign/: no app code, no sign-in. Shows the frozen invoice (in a
     sandboxed frame that can't run scripts) and the Pay panel from ../sign/pay.js. The link's token is after the "#", so it only
     ever travels in POST bodies to client-pay. -->
<style>
  :root{
    --page:#F5F4EF; --surface:#FFFFFF; --ink:#17171A; --ink-2:#67676D; --ink-3:#9A9AA1;
    --border:#E1E1E6; --border-strong:#D1D1D8; --accent:#4C6FA5; --accent-hover:#3D5C8C;
    --good:#2F7D5B; --good-wash:#E3F1EA; --bad:#A4473B;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:720px; margin:0 auto; padding:24px 16px calc(32px + env(safe-area-inset-bottom)); }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .brandhead{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .logo{ display:block; width:220px; max-width:100%; height:auto; }
  .label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:700; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 1px 2px rgba(23,23,26,.04),0 4px 14px rgba(23,23,26,.04); }
  iframe{ display:block; width:100%; border:0; border-radius:10px; min-height:300px; background:var(--page); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; padding:11px 18px; border-radius:8px; border:1px solid transparent; font:inherit; font-weight:600; cursor:pointer; transition:background .15s; }
  .btn-primary{ background:var(--accent); color:#fff; width:100%; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:disabled{ opacity:.55; cursor:default; }
  .btn-ghost{ background:var(--surface); border-color:var(--border-strong); color:var(--ink); }
  .err{ color:var(--bad); font-size:13.5px; margin:10px 0 0; min-height:1em; }
  .muted{ color:var(--ink-2); font-size:13.5px; margin:0 0 14px; }
  .msg{ padding:32px 20px; text-align:center; }
  .msg h1{ font-size:1.25rem; margin:0 0 6px; }
  @media print{ .top .btn, #pay{ display:none !important; } body{ background:#fff; } .wrap{ padding:0; max-width:none; } iframe{ border-radius:0; } }
</style>

<script src="../sign/pay.js"></script>
<div class="wrap" id="root"><div class="card msg"><p class="muted">Loading…</p></div></div>

<script>
(function(){
  const root = document.getElementById('root');
  let token = '';
  try{ token = decodeURIComponent((location.hash||'').replace(/^#/, '')); }catch(e){}
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function showMessage(h, p){ root.innerHTML = `<div class="card msg"><h1>${esc(h)}</h1><p class="muted" style="margin:0;">${esc(p)}</p></div>`; }
  function frame(html){
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-same-origin');
    f.title = 'Invoice';
    f.srcdoc = html;
    const fit = ()=>{ try{ f.style.height = (f.contentDocument.documentElement.scrollHeight + 4) + 'px'; }catch(e){} };
    f.addEventListener('load', ()=>{ fit(); setTimeout(fit, 300); });
    window.addEventListener('resize', fit);
    return f;
  }
  async function load(){
    if(!/^[A-Za-z0-9_-]{43}$/.test(token) || !window.ASPPay){ showMessage('This link doesn’t work', 'Check that you opened the whole link from your email, or ask us to send it again.'); return; }
    const res = await window.ASPPay.call(token, { action:'view' });
    if(!res.ok || !res.payment || !['invoice','event_balance'].includes(res.payment.kind)){
      if(res.error==='network') showMessage('No connection', 'Check your internet connection and reload this page.');
      else if(res.error==='server') showMessage('Something went wrong', 'Please try again in a minute.');
      else showMessage('This link doesn’t work', 'Check that you opened the whole link from your email, or ask us to send it again.');
      return;
    }
    const p = res.payment;
    if(p.kind==='event_balance'){
      // A balance has no document of its own: the client already has the contract.
      root.innerHTML = `<div class="top"><div class="brandhead"><img class="logo" src="../assets/brand/asp-horizontal-dark.png" alt="${esc(p.brandName)}" width="220" height="29"/><div class="label">Balance due</div></div></div><div id="pay"></div>`;
      window.ASPPay.mount(document.getElementById('pay'), token, p);
      return;
    }
    root.innerHTML = `<div class="top"><div class="brandhead"><img class="logo" src="../assets/brand/asp-horizontal-dark.png" alt="${esc(p.brandName)}" width="220" height="29"/><div class="label">Invoice ${esc(p.reference)}</div></div>
      <button class="btn btn-ghost" id="print" type="button">Print / Save PDF</button></div>
      <div id="doc"></div><div id="pay"></div>`;
    document.getElementById('doc').appendChild(frame(p.html));
    document.getElementById('print').onclick = ()=>window.print();
    window.ASPPay.mount(document.getElementById('pay'), token, p);
  }
  load();
})();
</script>
</html>
