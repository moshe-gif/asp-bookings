<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<!-- Content-Security-Policy (audit #7.2): this page runs only its own files and Stripe, and talks only to ASP's server and Stripe. A new outside service must be added here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; connect-src 'self' https://psgpxbkncuavlnpplykf.supabase.co https://api.stripe.com https://merchant-ui-api.stripe.com https://*.stripe.com; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://*.stripe.com" />
<title>Pay Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" type="image/png" href="../icon-192.png" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..700&display=swap" />
<!-- The client's payment page for an invoice (migration 0056) or a gig's balance (0063), Edge Function
     client-pay. Standalone like /sign/: no app code, no sign-in. Shows the frozen invoice (in a
     sandboxed frame that can't run scripts) and the Pay panel from ../sign/pay.js. The link's token is after the "#", so it only
     ever travels in POST bodies to client-pay. -->
<style>
  :root{
    --page:#F5F4EF; --surface:#FFFFFF; --ink:#17171A; --ink-2:#67676D; --ink-3:#9A9AA1;
    --border:#E1E1E6; --border-strong:#D1D1D8; --accent:#4C6FA5; --accent-hover:#3D5C8C;
    --good:#2F7D5B; --good-wash:#E3F1EA; --bad:#A4473B;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:720px; margin:0 auto; padding:24px 16px calc(32px + env(safe-area-inset-bottom)); }
  .top{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .brandhead{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .logo{ display:block; width:120px; max-width:100%; height:auto; }
  .artist{ font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:38px; font-weight:300; font-stretch:112%; line-height:1.05; letter-spacing:-.02em; color:var(--ink); margin:8px 0 2px; overflow-wrap:anywhere; }
  @media (max-width:420px){ .artist{ font-size:34px; } }
  .label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:700; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 1px 2px rgba(23,23,26,.04),0 4px 14px rgba(23,23,26,.04); }
  /* Only the invoice's own frame: Stripe's card fields are iframes too (a bare iframe rule covered them, 2026-11-09). */
  #doc > iframe{ display:block; width:100%; border:0; border-radius:10px; min-height:300px; background:var(--page); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; padding:11px 18px; border-radius:8px; border:1px solid transparent; font:inherit; font-weight:600; cursor:pointer; transition:background .15s; }
  .btn-primary{ background:var(--accent); color:#fff; width:100%; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:disabled{ opacity:.55; cursor:default; }
  .btn-ghost{ background:var(--surface); border-color:var(--border-strong); color:var(--ink); }
  .err{ color:var(--bad); font-size:13.5px; margin:10px 0 0; min-height:1em; }
  .muted{ color:var(--ink-2); font-size:13.5px; margin:0 0 14px; }
  .msg{ padding:32px 20px; text-align:center; }
  .msg h1{ font-size:1.25rem; margin:0 0 6px; }
  @media print{ .top .btn, #pay{ display:none !important; } body{ background:#fff; } .wrap{ padding:0; max-width:none; } #doc > iframe{ border-radius:0; } }
</style>

<script src="../sign/pay.js?v=20261112"></script>
<div class="wrap" id="root"><div class="card msg"><p class="muted">Loading…</p></div></div>

<script src="page.js?v=20261112"></script>
</html>
